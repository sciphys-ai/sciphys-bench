name: Validate benchmark contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate.py
      - name: Smoke-test scoring contract
        run: python scripts/score.py examples/xrd-synthetic-submission.v0.1.json --expect-vwcr 0.5
      - name: Run scorer regression tests
        run: python scripts/test_score.py
