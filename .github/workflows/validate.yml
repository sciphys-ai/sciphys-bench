name: Validate benchmark contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate.py
      - name: Smoke-test scoring contract
        run: python scripts/score.py examples/xrd-synthetic-submission.v0.1.json --expect-vwcr 0.5
      - name: Run scorer regression tests
        run: python scripts/test_score.py
